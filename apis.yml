aid: aifi
name: AiFi
description: 'AiFi is a spatial-intelligence platform that uses camera-only computer
  vision to understand human behavior in physical spaces. Founded in 2016 and headquartered
  in San Francisco, it powers autonomous checkout, frictionless identity and entry,
  real-time fraud prevention, historical journey analytics and an operational co-pilot
  across retail, stadiums and arenas, quick-service restaurants, travel hubs, healthcare,
  campuses and government border control. The platform needs no shelf sensors or RFID
  and tracks shoppers with anonymous skeletal keypoint detection rather than facial
  recognition by default. AiFi publishes a suite of retailer-facing OASIS APIs that
  bridge its platform to POS (NCR, Oracle, Square) and payment (Stripe, Adyen) systems,
  but the developer documentation is served only to authenticated accounts through
  an AiFi Keycloak single sign-on.'
